<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-line"></i> To-Do List Life Dashboard</h1>
            <div class="theme-switch">
                <button id="themeToggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <div class="dashboard-grid">
            <!-- Greeting and Time Section -->
            <section class="card greeting-section">
                <h2><i class="fas fa-sun"></i> Welcome!</h2>
                <div class="time-display">
                    <div class="current-time" id="currentTime">00:00:00</div>
                    <div class="current-date" id="currentDate">Friday, June 5, 2026</div>
                </div>
                <div class="greeting-text" id="greetingText">Good day!</div>
                <div class="name-customization">
                    <input type="text" id="userName" placeholder="Enter your name..." value="User">
                    <button id="saveNameBtn" class="btn-small">
                        <i class="fas fa-check"></i> Save Name
                    </button>
                </div>
            </section>

            <!-- Focus Timer Section -->
            <section class="card timer-section">
                <h2><i class="fas fa-clock"></i> Focus Timer</h2>
                <div class="timer-display">
                    <div class="timer" id="timer">25:00</div>
                    <div class="timer-label">Pomodoro Session</div>
                </div>
                <div class="timer-controls">
                    <button id="startTimer" class="btn-primary">
                        <i class="fas fa-play"></i> Start
                    </button>
                    <button id="pauseTimer" class="btn-secondary" disabled>
                        <i class="fas fa-pause"></i> Pause
                    </button>
                    <button id="resetTimer" class="btn-secondary">
                        <i class="fas fa-redo"></i> Reset
                    </button>
                </div>
                <div class="timer-settings">
                    <label for="timerDuration">Timer Duration (minutes):</label>
                    <input type="number" id="timerDuration" min="1" max="60" value="25">
                    <button id="saveTimerBtn" class="btn-small">
                        <i class="fas fa-save"></i> Update
                    </button>
                </div>
            </section>

            <!-- To-Do List Section -->
            <section class="card todo-section">
                <h2><i class="fas fa-tasks"></i> To-Do List</h2>
                <div class="todo-input">
                    <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="100">
                    <button id="addTaskBtn" class="btn-primary">
                        <i class="fas fa-plus"></i> Add
                    </button>
                </div>
                <div class="task-filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="pending">Pending</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <div class="todo-list" id="todoList">
                    <!-- Tasks will be added here dynamically -->
                </div>
                <div class="todo-stats">
                    <span id="taskCount">0 tasks</span>
                    <button id="clearCompletedBtn" class="btn-small">
                        <i class="fas fa-trash"></i> Clear Completed
                    </button>
                </div>
            </section>

            <!-- Quick Links Section -->
            <section class="card links-section">
                <h2><i class="fas fa-link"></i> Quick Links</h2>
                <div class="links-input">
                    <input type="text" id="linkName" placeholder="Link name" maxlength="30">
                    <input type="url" id="linkUrl" placeholder="https://example.com">
                    <button id="addLinkBtn" class="btn-primary">
                        <i class="fas fa-plus"></i> Add Link
                    </button>
                </div>
                <div class="links-list" id="linksList">
                    <!-- Quick links will be added here dynamically -->
                </div>
            </section>
        </div>

        <footer>
            <p>To-Do List Life Dashboard &copy; 2026 | All data stored locally in your browser</p>
            <div class="footer-links">
                <a href="https://github.com" target="_blank" class="footer-link">
                    <i class="fab fa-github"></i> GitHub
                </a>
                <button id="exportData" class="footer-link">
                    <i class="fas fa-download"></i> Export Data
                </button>
                <button id="importData" class="footer-link">
                    <i class="fas fa-upload"></i> Import Data
                </button>
            </div>
        </footer>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <h3>Confirm Action</h3>
            <p id="modalMessage">Are you sure you want to proceed?</p>
            <div class="modal-buttons">
                <button id="modalConfirm" class="btn-primary">Confirm</button>
                <button id="modalCancel" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
